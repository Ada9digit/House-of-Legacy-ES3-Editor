<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="google-site-verification" content="4WbeWQVFwSV-y6hO__zWrgfIJmqcKv_gwLFReMgTmTs" />
    <title>House of Legacy · Save Editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>🏮 House of Legacy · Save Editor</h1>
      <div class="sub">Auto‑max only touches safe stats. No events, duties, pregnancy or fertility are modified.</div>
      <div class="toolbar">
        <input type="file" id="fileInput" accept=".es3,.json" hidden />
        <button data-a="open">📂 Open GameData.es3</button>
        <button class="btn-primary" data-a="save">💾 Save Archive</button>
        <button class="btn-danger" data-a="reset">⟳ Reset</button>
        <span class="badge" id="status">No save loaded</span>
      </div>
      <div class="tabs" id="tabs"></div>
      <div id="panels"></div>
      <footer>Items 0‑285. Auto‑max spouse = age 21, stats 100, relation 100, luck 100, talentVal 100.</footer>
    </div>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/rendering.js"></script>
    <script src="js/editor.js"></script>
  </body>
</html>
